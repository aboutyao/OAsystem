spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/oa_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:oa}
    password: ${DB_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

flowable:
  database-schema-update: true

file:
  storage:
    path: ${FILE_STORAGE_PATH:/var/oa/files}

security:
  jwt:
    secret: ${JWT_SECRET:oa-system-trial-jwt-secret-must-be-at-least-32chars}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:7200}
