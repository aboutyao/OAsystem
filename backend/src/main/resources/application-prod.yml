spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/oa_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:oa}
    password: ${DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

flowable:
  database-schema-update: false

file:
  storage:
    path: ${FILE_STORAGE_PATH:/opt/oa/files}

security:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_PROD_JWT_SECRET_MUST_BE_SET_VIA_ENV_VAR}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:7200}
